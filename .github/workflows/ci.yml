name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check build environment
        run: |
          java -version
          mvn --version
          python --version
          docker info

      - name: Test benchmark report scripts
        run: |
          python -m unittest discover -s reliable-event-benchmark/scripts/tests -v 2>&1 | tee python-tests.log

      # Keep the Maven reactor sequential: RocketMQ tests bind host port 8081.
      - name: Build and test all Maven modules
        run: |
          mvn --batch-mode --no-transfer-progress clean verify 2>&1 | tee maven-verify.log

      - name: Require tests without failures or skips
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path('.').glob('*/target/surefire-reports/TEST-*.xml'))
          reports += sorted(Path('.').glob('*/target/failsafe-reports/TEST-*.xml'))
          if not reports:
              raise SystemExit('No Maven test reports found.')

          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          invalid = []
          for report in reports:
              suite = ET.parse(report).getroot()
              counts = {key: int(suite.get(key, '0')) for key in totals}
              for key, count in counts.items():
                  totals[key] += count
              if any(counts[key] for key in ('failures', 'errors', 'skipped')):
                  invalid.append(str(report))

          print(f'{len(reports)} reports: {totals}')
          if not totals['tests'] or invalid:
              raise SystemExit('Tests must run without failures, errors or skips.\n'
                               + '\n'.join(invalid))
          PY

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            maven-verify.log
            python-tests.log
            */target/surefire-reports/**
            */target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified JARs
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: '*/target/*.jar'
          if-no-files-found: error
          retention-days: 7
