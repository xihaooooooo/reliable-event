apiVersion: 1
datasources:
  - name: Prometheus
    uid: reliable-event-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: reliable-event-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: reliable-event-prometheus
      serviceMap:
        datasourceUid: reliable-event-prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
