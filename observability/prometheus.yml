global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/reliable-event.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: reliable-event-example
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8090]
        labels:
          outbox_store: reliable-event-example
          expected_scheduler: "true"
          scheduler_mode: automatic
          expected_snapshot: "true"
          snapshot_mode: automatic
          deployment: local-example
