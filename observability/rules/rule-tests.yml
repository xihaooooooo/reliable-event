      - series: 'up{job="reliable-event-example",instance="a",outbox_store="db",expected_snapshot="true",snapshot_mode="automatic"}'
        values: '1+0x52'
      - series: 'reliable_event_snapshot_last_success_timestamp{job="reliable-event-example",instance="a",outbox_store="db"}'
