services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: reliable_event_example
      MYSQL_USER: example
      MYSQL_PASSWORD: example
      MYSQL_ROOT_PASSWORD: example-root
      TZ: UTC
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pexample-root --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - example-mysql-data:/var/lib/mysql

  nameserver:
    image: apache/rocketmq:5.5.0
    command: ["sh", "mqnamesrv"]

  broker:
    image: apache/rocketmq:5.5.0
    depends_on:
      - nameserver
    environment:
      NAMESRV_ADDR: nameserver:9876
    command: ["sh", "mqbroker", "--enable-proxy", "-c", "/home/rocketmq/rocketmq-5.5.0/conf/example-broker.conf"]
    ports:
      - "8081:8081"
    volumes:
      - ./broker.conf:/home/rocketmq/rocketmq-5.5.0/conf/example-broker.conf:ro

volumes:
  example-mysql-data:
