server:
  port: ${EXAMPLE_HTTP_PORT:8082}
spring:
  datasource:
    url: ${EXAMPLE_JDBC_URL:jdbc:mysql://localhost:13307/reliable_event_kafka_example?connectionTimeZone=UTC}
    username: ${EXAMPLE_DB_USER:example}
    password: ${EXAMPLE_DB_PASSWORD:example}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema/reliable-event-outbox.sql,classpath:schema/example-tables.sql
management:
  otlp:
    tracing:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${EXAMPLE_TRACE_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
example:
  kafka:
    topic: ${EXAMPLE_KAFKA_TOPIC:reliable-event-kafka-example}
    consumer-group: ${EXAMPLE_KAFKA_GROUP:reliable-event-kafka-example-consumer}
    create-topic: ${EXAMPLE_KAFKA_CREATE_TOPIC:false}
    partitions: ${EXAMPLE_KAFKA_PARTITIONS:1}
    replication-factor: ${EXAMPLE_KAFKA_REPLICATION_FACTOR:1}
reliable-event:
  transport: kafka
  lease-duration: 30s
  poll-interval: 200ms
  kafka:
    bootstrap-servers: ${EXAMPLE_KAFKA_BOOTSTRAP:localhost:19092}
    mappings:
      order-created:
        topic: ${example.kafka.topic}
